# Binder — a letter-size recipe binder page.
# Modeled on the MacGourmet "Binder" theme. Every key is explained in ../README.md.

etna-theme: 2
kind: card
name: Binder
description: Letter-size recipe binder page with a ruled frame.

page:
  size: letter            # the default paper: one of page.papers
  margin: 0.45in 0.25in 0.5in   # top, sides, bottom: the page margins
  # The papers Binder is made for, each with what changes on it (margin, font-size, fit).
  papers:
    letter: {}
    a4: {}
    half-letter: { margin: 0.35in 0.25in 0.4in, font-size: 9.5pt, fit: { min: 8.5pt, max: 10.5pt } }
    index-5x7: { margin: 0.25in 0.22in 0.3in, font-size: 8.5pt, fit: { min: 7.5pt, max: 9.5pt } }
    index-4x6: { margin: 0.2in 0.2in 0.28in, font-size: 8pt, fit: { min: 7pt, max: 9pt } }

# Fitting may shrink the text down to min to save a nearly empty last page; it never grows it.
# A reader may pick any size from min to max (--size, the Size control). See ../README.md#fit.
fit:
  min: 9.5pt
  max: 12pt

skeleton: card.html       # the card fragment, with named slots

# Free fonts the renderer delivers (etna fonts; see ../README.md#web-fonts). Only the
# weights and styles the stylesheet uses.
webfonts:
  - family: Quicksand   # title, weight 300
    google: 'Quicksand:wght@300'
  - family: Jost        # text: 400, 700, italic 400
    google: 'Jost:ital,wght@0,400;0,700;1,400'

options:
  fonts:
    # Free fonts always, delivered from webfonts:; the generic family is the last resort.
    body: 'Jost, sans-serif'
    title: 'Quicksand, sans-serif'
    title-weight: 300       # the title's weight: card.css sets it from --card-font-title-weight
  font-size: 11pt

  # Title, ingredients and directions are always printed. Everything else is a slot.
  slots:
    intro: true           # text between the title and the first section, when a recipe has any
    notes: true           # a place for the notes; printed only when asked (--notes)
    picture: true          # the recipe's picture (image/etna.jpg): beside the ingredient list
    yield: false
    source: false
    version: false
    license: false

  display:
    units: long           # long (grams, 1 clove, 2 cloves) | symbol (g, tbsp)
    fractions: unicode    # unicode (1 ½) | ascii (1 1/2)
    range: to             # to (2 to 3) | dash (2–3)

# Words the renderer prints. Callout keywords map to the label shown on the card.
labels:
  choose: Choose one
  option: Option
  see: see
  from: from
  above: above
  below: below
  callouts:
    Checkpoint: Checkpoint
