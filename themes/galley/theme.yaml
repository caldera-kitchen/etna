# Galley — a dense two-column sheet: the whole recipe on one page when it can be.
# See README.md for the idea; every key is explained in ../README.md.

etna-theme: 2
kind: card
name: Galley
description: Dense two-column sheet in a condensed face. Fits a long recipe on one page.

page:
  size: letter
  margin: 0.5in 0.55in 0.7in
  papers:
    letter: {}
    a4: {}

# Dense is the point: a long recipe may go a little smaller to stay on one page.
fit:
  min: 8.5pt
  max: 11pt

skeleton: card.html

# Free fonts the renderer delivers (etna fonts; see ../README.md#web-fonts). Only the
# weights and styles the stylesheet uses.
webfonts:
  - family: IBM Plex Sans Condensed   # text and title: 400, 500, 600, 700, italic 400
    google: 'IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400'

options:
  fonts:
    # Free fonts always, delivered from webfonts:; the generic family is the last resort.
    body: '"IBM Plex Sans Condensed", sans-serif'
    title: '"IBM Plex Sans Condensed", sans-serif'
    title-weight: 700       # the title's weight: card.css sets it from --card-font-title-weight
  font-size: 10pt

  # Structured recipes: each step carries its own ingredients (hoisted | paired).
  layout: paired

  slots:
    intro: true
    notes: true           # a place for the notes; printed only when asked (--notes)
    yield: true
    source: true
    version: false
    license: false

  display:
    units: symbol
    fractions: unicode
    range: dash

labels:
  yield: Makes
  source: From
  choose: Choose one
  option: Option
  see: see
  from: from
  above: above
  below: below
  callouts:
    Checkpoint: Checkpoint
