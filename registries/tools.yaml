  - name: pastry brush
    kind: utensil
  - name: potato masher
    kind: utensil
  - name: bench scraper
    kind: utensil
    # dough scraper 4
    aliases: [dough scraper]
  - name: wire rack
    kind: utensil
    aliases: [cooling rack]
  - name: thermometer
    kind: utensil
  - name: sieve
    kind: utensil
    aliases: [strainer, fine-mesh sieve, fine-mesh strainer]
  - name: piping bag
